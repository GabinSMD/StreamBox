<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamBox, configurer un overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<main class="wrap">
  <div class="cfg">
    <section class="box">
      <h1 id="name"></h1>
      <p class="lead" id="tagline"></p>
      <form id="form" autocomplete="off"></form>
      <div class="importbar">
        <input type="text" id="importurl" placeholder="Coller le lien d’un overlay déjà dans OBS" aria-label="Lien à modifier">
        <button class="btn ghost" type="button" id="import">Modifier</button>
      </div>
      <button class="btn ghost" type="button" id="reset">Réglages par défaut</button>
    </section>
    <section>
      <div class="box">
        <div class="urlbar">
          <input type="text" id="url" readonly aria-label="Lien de l’overlay">
          <button class="btn" type="button" id="copy">Copier</button>
        </div>
        <div class="preview game" id="preview"><div class="stage" id="stage"><iframe id="frame" title="Aperçu"></iframe></div></div>
        <div class="ptools">
          <label><input type="checkbox" id="demo" checked> Aperçu avec de faux messages</label>
          <label><input type="checkbox" id="gamebg" checked> Fond de jeu</label>
          <label class="btn ghost small">🖼️ Mon fond d’aperçu<input type="file" id="bgfile" accept="image/*" hidden></label>
          <span id="dims"></span>
        </div>
        <ol class="steps">
          <li>Dans OBS : <b>Sources → + → Navigateur</b>.</li>
          <li>Colle le lien copié dans <b>URL</b> et règle la taille sur <b id="sizehint"></b>.</li>
          <li id="audiohint" hidden>Pour entendre le son, coche <b>Contrôler l’audio via OBS</b>.</li>
          <li>Pour modifier un réglage plus tard, reviens ici et recopie le nouveau lien.</li>
        </ol>
      </div>
      <div class="box" id="cmdbox" style="margin-top:16px" hidden>
        <h1 style="font-size:17px">Commandes de chat <span class="flag">streamer et modos</span></h1>
        <table class="cmds" id="cmds"></table>
      </div>
      <div class="box" id="setupbox" style="margin-top:16px" hidden><h1 style="font-size:17px">Installation dans OBS</h1><ol class="steps" id="setup"></ol></div>
      <div class="note" id="note" hidden></div>
    </section>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/tools.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  const id = new URLSearchParams(location.search).get('id');
  const tool = SB_TOOLS.find((t) => t.id === id) || SB_TOOLS[0];
  const KEY = 'sb-cfg-' + tool.id;
  const $ = (x) => document.getElementById(x);
  document.title = tool.name + ' · StreamBox';
  $('name').textContent = tool.icon + ' ' + tool.name;
  $('tagline').textContent = tool.tagline;
  $('sizehint').textContent = tool.size[0] + ' × ' + tool.size[1];
  $('dims').textContent = 'Taille conseillée : ' + tool.size[0] + ' × ' + tool.size[1];
  if (tool.fields.some((f) => f.key === 'sound')) $('audiohint').hidden = false;
  if (tool.setup) { $('setupbox').hidden = false; tool.setup.forEach((t) => $('setup').appendChild(Object.assign(document.createElement('li'), { textContent: t }))); }
  if (tool.note) { $('note').hidden = false; $('note').textContent = tool.note; }
  if (tool.commands) {
    $('cmdbox').hidden = false;
    tool.commands.forEach(([cmd, desc]) => {
      const tr = $('cmds').insertRow();
      const a = tr.insertCell(); const code = document.createElement('code'); code.textContent = cmd; a.appendChild(code);
      tr.insertCell().textContent = desc;
    });
  }

  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { saved = {}; }

  /* ----- Formulaire ----- */
  const form = $('form');
  const VISIBLE = 5;
  let more = null, styleBox = null;
  function place(wrap, f, i) {
    if (f.group === 'style') {
      if (!styleBox) { styleBox = document.createElement('details'); styleBox.className = 'more style'; styleBox.innerHTML = '<summary>🎨 Personnaliser l’apparence</summary>'; form.appendChild(styleBox); }
      styleBox.appendChild(wrap);
    } else if (i < VISIBLE) form.appendChild(wrap);
    else {
      if (!more) { more = document.createElement('details'); more.className = 'more'; more.innerHTML = '<summary>Plus de réglages</summary>'; form.insertBefore(more, styleBox); }
      more.appendChild(wrap);
    }
  }
  tool.fields.forEach((f, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'field' + (f.type === 'checkbox' ? ' check' : '');
    const inputId = 'f-' + f.key;
    let input;
    if (f.type === 'twitch') {
      wrap.appendChild(Object.assign(document.createElement('label'), { textContent: f.label }));
      input = document.createElement('input'); input.type = 'hidden'; input.name = f.key; wrap.appendChild(input);
      const status = document.createElement('small'); const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'btn ghost'; btn.style.marginTop = '4px';
      wrap.append(btn, status);
      const TK = 'sb-twitch-token';
      let tok = ''; try { tok = localStorage.getItem(TK) || ''; } catch (e) { /* ignore */ }
      const setOut = (msg) => {
        input.value = ''; btn.textContent = 'Se connecter avec Twitch';
        btn.onclick = () => { location.href = 'connexion.html?retour=' + encodeURIComponent('outil.html?id=' + tool.id) + (f.scope ? '&scope=' + encodeURIComponent(f.scope) : ''); };
        status.textContent = msg || (f.scope === 'clips:edit' ? 'Seule permission demandée : créer des clips de ta chaîne.' : 'Aucune permission demandée : StreamBox lit seulement tes clips publics.');
      };
      if (!window.SB_CONFIG || !SB_CONFIG.twitchClientId) { btn.style.display = 'none'; status.textContent = 'Connexion Twitch pas encore configurée sur ce site (twitchClientId dans js/config.js).'; }
      else if (!tok) setOut();
      else {
        input.value = tok; btn.textContent = 'Se déconnecter';
        btn.onclick = () => { try { localStorage.removeItem(TK); } catch (e) { /* ignore */ } setOut(); update(); };
        status.textContent = 'Vérification…';
        fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + tok } })
          .then((r) => (r.ok ? r.json() : null))
          .then((d) => {
            if (!d) { try { localStorage.removeItem(TK); } catch (e) { /* ignore */ } setOut('Connexion expirée : reconnecte-toi.'); update(); return; }
            const missing = f.scope && !(d.scopes || []).includes(f.scope);
            status.textContent = (missing ? 'Reconnecte-toi pour autoriser la création de clips. ' : '') + `Connecté en tant que ${d.login} (expire dans ${Math.max(1, Math.round(d.expires_in / 86400))} j). Le lien contient ce jeton : ne le montre pas en stream.`;
          }).catch(() => { status.textContent = 'Connecté (vérification impossible pour le moment).'; });
      }
      place(wrap, f, i);
      return;
    }
    if (f.type === 'select') {
      input = document.createElement('select');
      f.options.forEach((o) => {
        const [v, l] = Array.isArray(o) ? o : [o, o];
        const opt = document.createElement('option'); opt.value = v; opt.textContent = l; input.appendChild(opt);
      });
    } else if (f.type === 'textarea') {
      input = document.createElement('textarea');
      input.rows = 5; input.spellcheck = false;
      if (f.placeholder) input.placeholder = f.placeholder;
    } else {
      input = document.createElement('input');
      input.type = f.type;
      if (f.placeholder) input.placeholder = f.placeholder;
      ['min', 'max', 'step'].forEach((k) => f[k] != null && (input[k] = f[k]));
    }
    input.id = inputId; input.name = f.key;
    const v = f.key in saved ? saved[f.key] : f.default;
    if (f.type === 'checkbox') input.checked = !!v; else input.value = v;
    const label = document.createElement('label'); label.htmlFor = inputId;
    if (f.type === 'checkbox') { label.appendChild(input); label.append(f.label); wrap.appendChild(label); }
    else if (f.type === 'range') {
      label.textContent = f.label; const out = document.createElement('output'); out.className = 'rangeval';
      const sync = () => { out.textContent = input.value; }; input.addEventListener('input', sync); sync();
      const row = document.createElement('div'); row.className = 'rangerow'; row.append(input, out);
      wrap.append(label, row);
    } else { label.textContent = f.label; wrap.append(label, input); }
    if (f.help) { const s = document.createElement('small'); s.textContent = f.help; wrap.appendChild(s); }
    place(wrap, f, i);
  });

  function values() {
    const out = {};
    tool.fields.forEach((f) => {
      const el = form.elements[f.key];
      out[f.key] = f.type === 'checkbox' ? el.checked : (f.type === 'number' || f.type === 'range') ? (el.value === '' ? f.default : parseFloat(el.value)) : el.value.trim();
    });
    return out;
  }

  function overlayUrl(vals, extra) {
    const u = new URL(tool.overlay, location.href);
    tool.fields.forEach((f) => {
      const v = vals[f.key];
      if (v === f.default || (f.type === 'checkbox' && !!v === !!f.default)) return;
      u.searchParams.set(f.key, f.type === 'checkbox' ? (v ? '1' : '0') : String(v));
    });
    Object.entries(extra || {}).forEach(([k, v]) => u.searchParams.set(k, v));
    return u.toString();
  }

  /* ----- Aperçu ----- */
  const frame = $('frame'), stage = $('stage'), preview = $('preview');
  frame.width = tool.size[0]; frame.height = tool.size[1];
  function fit() {
    const cw = preview.clientWidth;
    const s = Math.min(1, cw / tool.size[0], 520 / tool.size[1]);
    stage.style.transform = `scale(${s})`;
    stage.style.left = Math.max(0, (cw - tool.size[0] * s) / 2) + 'px';
    preview.style.height = tool.size[1] * s + 'px';
  }
  addEventListener('resize', fit);

  let timer, lastSrc = '';
  function update() {
    const vals = values();
    try { const keep = Object.assign({}, vals); tool.fields.forEach((f) => f.type === 'twitch' && delete keep[f.key]); localStorage.setItem(KEY, JSON.stringify(keep)); } catch (e) { /* stockage indisponible */ }
    $('url').value = overlayUrl(vals);
    const useDemo = $('demo').checked || !vals.channel;
    const src = overlayUrl(useDemo ? Object.assign({}, vals, { channel: '', token: '' }) : vals, useDemo ? { demo: '1' } : {});
    clearTimeout(timer);
    timer = setTimeout(() => { if (src !== lastSrc) { frame.src = src; lastSrc = src; } }, 350);
  }
  form.addEventListener('input', update);
  form.addEventListener('change', update);
  $('demo').addEventListener('change', update);
  $('gamebg').addEventListener('change', () => preview.classList.toggle('game', $('gamebg').checked));
  $('reset').addEventListener('click', () => {
    tool.fields.forEach((f) => { const el = form.elements[f.key]; if (f.key === 'channel') return; if (f.type === 'twitch') return; if (f.type === 'checkbox') el.checked = f.default; else el.value = f.default; });
    update();
  });
  $('copy').addEventListener('click', async () => {
    const v = values();
    if (!v.channel && tool.fields[0].key === 'channel' && !/optionnel/i.test(tool.fields[0].label)) {
      form.elements.channel.focus(); toast('Indique d’abord le nom de ta chaîne'); return;
    }
    try { await navigator.clipboard.writeText($('url').value); }
    catch (e) { $('url').select(); document.execCommand('copy'); }
    toast('Lien copié, colle-le dans OBS');
  });
  /* Reprendre un overlay existant : on relit les paramètres de son lien */
  $('import').addEventListener('click', () => {
    let u;
    try { u = new URL($('importurl').value.trim()); } catch (e) { toast('Ce lien n’est pas valide'); return; }
    if (!u.pathname.endsWith('/' + tool.overlay.split('/').pop())) {
      const other = SB_TOOLS.find((t) => u.pathname.endsWith('/' + t.overlay.split('/').pop()));
      if (other) { toast('Ce lien est un overlay « ' + other.name + ' » : ouverture…'); setTimeout(() => { location.href = 'outil.html?id=' + other.id + '#import=' + encodeURIComponent(u.href); }, 800); }
      else toast('Ce lien ne vient pas de StreamBox');
      return;
    }
    tool.fields.forEach((f) => {
      const el = form.elements[f.key];
      if (!el || f.type === 'twitch') return;
      const has = u.searchParams.has(f.key), raw = u.searchParams.get(f.key);
      if (f.type === 'checkbox') el.checked = has ? raw === '1' || raw === 'true' : !!f.default;
      else el.value = has ? raw : f.default;
      el.dispatchEvent(new Event('input'));
    });
    $('importurl').value = '';
    update(); toast('Réglages chargés : modifie-les puis recopie le lien');
  });
  const imp = new URLSearchParams(location.hash.slice(1)).get('import');
  if (imp) { $('importurl').value = imp; history.replaceState(null, '', location.pathname + location.search); setTimeout(() => $('import').click(), 0); }

  /* Fond d'aperçu personnel (capture de son jeu, de sa scène…) : reste dans le navigateur */
  $('bgfile').addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    preview.style.backgroundImage = `url("${URL.createObjectURL(file)}")`;
    preview.style.backgroundSize = 'cover'; preview.style.backgroundPosition = 'center';
    preview.classList.remove('game'); $('gamebg').checked = false;
  });
  $('gamebg').addEventListener('change', () => { if ($('gamebg').checked) preview.style.backgroundImage = ''; });

  fit(); update();
})();
</script>
</body>
</html>
