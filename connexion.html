<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<title>Connexion Twitch · StreamBox</title>
<meta name="description" content="Connexion à StreamBox avec ton compte Twitch.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="StreamBox">
<meta property="og:title" content="Connexion Twitch · StreamBox">
<meta property="og:description" content="Connexion à StreamBox avec ton compte Twitch.">
<meta property="og:image" content="https://streambox.gabin-simond.fr/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&family=Tektur:wght@700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/site.css">
<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
</head>
<body>
<main class="wrap"><div class="box" style="margin:48px auto;max-width:520px"><h1 id="h">Connexion à Twitch…</h1><p class="lead" id="p"></p></div></main>
<script src="js/config.js"></script>
<script src="js/account.js"></script>
<script src="js/site.js"></script>
<script>
/* Flux OAuth « implicite » : aucun secret. Permissions : clips, follows, points de chaîne, nombre d'abonnés.
 * Le jeton reste dans le navigateur (localStorage) : lecture des données publiques, et création de clips si clips:edit est accordé. */
const KEY = 'sb-twitch-token';
const safeReturn = (r) => (r && /^[\w\-./?=&%]+$/.test(r) && !r.includes('//') ? r : 'index.html');
const hash = new URLSearchParams(location.hash.slice(1));
const q = new URLSearchParams(location.search);
const say = (h, p) => { document.getElementById('h').textContent = h; document.getElementById('p').textContent = p || ''; };

if (q.get('code') && q.get('state')) {
  // Compte StreamBox : le relais échange le code (avec le secret Twitch, qui ne quitte jamais le serveur)
  let expected = null;
  try { expected = sessionStorage.getItem('sb-oauth-state'); sessionStorage.removeItem('sb-oauth-state'); } catch (e) { /* ignore */ }
  const [nonce, ...ret] = q.get('state').split('|');
  if (!expected || nonce !== expected) say('Connexion refusée', 'La réponse de Twitch ne correspond pas à la demande. Réessaie.');
  else {
    say('Connexion…', 'Ouverture de ton compte StreamBox');
    let mode = null; try { mode = sessionStorage.getItem('sb-oauth-mode'); sessionStorage.removeItem('sb-oauth-mode'); } catch (e) { /* ignore */ }
    fetch(SBA.relay() + '/auth/twitch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: q.get('code'), redirect_uri: location.origin + location.pathname, mode }) })
      .then((r) => r.json().then((d) => [r.ok, d]))
      .then(async ([ok, d]) => {
        if (!ok) return say('Connexion impossible', d.error || '');
        if (d.bot) { say('Compte bot connecté ✓', d.login + ' peut maintenant écrire dans les chats. Retour…'); return setTimeout(() => location.replace('bot.html'), 1200); }
        SBA.set({ session: d.session, login: d.login });
        if (window.SB && SB.lang && mode !== 'viewer') await SBA.api('PUT', '/me/lang', { lang: SB.lang() }).catch(() => {}); // langue des réponses du bot
        say('Connecté !', 'Bienvenue ' + d.login + ' 👋');
        location.replace(safeReturn(decodeURIComponent(ret.join('|'))));
      }).catch(() => say('Connexion impossible', 'Le relais StreamBox ne répond pas.'));
  }
} else if (hash.get('access_token')) {
  let expected = null;
  try { expected = sessionStorage.getItem('sb-oauth-state'); sessionStorage.removeItem('sb-oauth-state'); } catch (e) { /* ignore */ }
  const [nonce, ...ret] = (hash.get('state') || '').split('|');
  // la demande doit venir de cet onglet (sinon : jeton imposé par un lien piégé)
  if (!expected || nonce !== expected) say('Connexion refusée', 'La réponse de Twitch ne correspond pas à la demande. Réessaie.');
  else {
    try { localStorage.setItem(KEY, hash.get('access_token')); } catch (e) { /* ignore */ }
    say('Connecté !', 'Retour à l’outil…');
    location.replace(safeReturn(decodeURIComponent(ret.join('|'))));
  }
} else if (q.get('error') || hash.get('error')) {
  say('Connexion annulée', q.get('error_description') || hash.get('error_description') || '');
} else if (!SB_CONFIG.twitchClientId) {
  say('Connexion Twitch non configurée', 'Le propriétaire du site doit renseigner twitchClientId dans js/config.js (voir le README).');
} else {
  const nonce = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, '0')).join('');
  try { sessionStorage.setItem('sb-oauth-state', nonce); } catch (e) { /* ignore */ }
  const u = new URL('https://id.twitch.tv/oauth2/authorize');
  u.searchParams.set('client_id', SB_CONFIG.twitchClientId);
  u.searchParams.set('redirect_uri', location.origin + location.pathname);
  // Avec un relais : vrai compte (code + jeton renouvelé par le relais). Sans relais : jeton direct dans le navigateur.
  u.searchParams.set('response_type', SBA.enabled() ? 'code' : 'token');
  // Une seule connexion pour tous les outils StreamBox, avec uniquement ces permissions :
  const base = 'clips:edit moderator:read:followers channel:read:redemptions channel:read:subscriptions channel:read:hype_train channel:read:ads channel:read:polls channel:read:predictions';
  // Bot de chat : permissions en plus, demandées seulement quand le streamer active le bot
  const BOT = 'user:read:chat user:write:chat user:bot channel:bot moderator:manage:chat_messages moderator:manage:banned_users moderator:manage:shoutouts bits:read moderator:manage:chat_settings moderator:manage:shield_mode';
  const BOT_ACCOUNT = 'user:read:chat user:write:chat user:bot moderator:manage:chat_messages moderator:manage:banned_users moderator:manage:shoutouts moderator:manage:chat_settings moderator:manage:shield_mode';
  // Modération : pour les modos (et le streamer) qui utilisent le panneau de modération
  const MOD = 'user:read:moderated_channels moderator:manage:banned_users moderator:manage:chat_messages moderator:manage:chat_settings moderator:manage:automod moderator:manage:shield_mode moderator:manage:announcements moderator:manage:warnings moderator:manage:unban_requests moderator:manage:blocked_terms moderator:read:moderators moderator:read:vips moderator:read:chatters';
  // Gestion du live (streamer seulement) : titre, jeu, raid
  const LIVE = 'channel:manage:broadcast channel:manage:raids channel:manage:polls channel:manage:predictions channel:manage:redemptions moderation:read';
  const EXTRA = { bot: BOT, mod: MOD, live: MOD + ' ' + LIVE };
  // Les permissions en plus déjà accordées sont redemandées à chaque connexion, pour ne pas les perdre
  let wants = [];
  try { wants = JSON.parse(localStorage.getItem('sb-wants') || '[]'); if (localStorage.getItem('sb-wants-bot') === '1') wants.push('bot'); } catch (e) { /* ignore */ }
  if (EXTRA[q.get('scope')]) wants.push(q.get('scope'));
  wants = [...new Set(wants.filter((w) => EXTRA[w]))];
  try { localStorage.setItem('sb-wants', JSON.stringify(wants)); localStorage.removeItem('sb-wants-bot'); } catch (e) { /* ignore */ }
  const botAccount = q.get('mode') === 'botaccount';
  const viewer = q.get('viewer') === '1'; // viewer qui veut voter : aucune permission
  try { if (botAccount || viewer) sessionStorage.setItem('sb-oauth-mode', botAccount ? 'botaccount' : 'viewer'); } catch (e) { /* ignore */ }
  const scope = botAccount ? BOT_ACCOUNT : viewer ? '' : [...new Set([base, ...wants.map((w) => EXTRA[w])].join(' ').split(' '))].join(' ');
  u.searchParams.set('scope', scope);
  if (botAccount || q.get('scope') === 'bot') u.searchParams.set('force_verify', 'true'); // permet de choisir le bon compte Twitch
  u.searchParams.set('state', nonce + '|' + encodeURIComponent(safeReturn(q.get('retour'))));
  location.replace(u.toString());
}
</script>
</body>
</html>
