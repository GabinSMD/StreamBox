<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>StreamBox · Chat</title>
<link rel="stylesheet" href="../css/overlay.css">
</head>
<body>
<div id="chat"></div>
<script src="../js/config.js"></script>
<script src="../js/sb.js"></script>
<script src="../js/multichat.js"></script>
<script>
const c = SB.params({
  channel: '', kick: '', kickroom: '', youtube: '', icons: true, theme: 'bulles', size: 18, fade: 0, max: 25, hidebots: true, hidecmd: false,
  bots: '', align: 'left', badges: true, font: 'Inter', accent: '#9b5cff', anim: true,
  seventv: true, bttv: true, ffz: true, demo: false,
});
SB.loadFont(c.font); SB.setAccent(c.accent);
document.body.classList.add('t-' + c.theme);
document.documentElement.style.setProperty('--size', c.size + 'px');
const box = document.getElementById('chat');
if (c.align === 'right') box.classList.add('right');

const BOTS = new Set(['nightbot', 'streamelements', 'streamlabs', 'moobot', 'fossabot', 'wizebot', 'soundalerts', 'sery_bot', 'botrixoficial']);
const extraBots = new Set(c.bots.split(/[\s,]+/).filter(Boolean).map((s) => s.toLowerCase()));
const emotes = new SB.EmoteStore();

const multi = [c.channel, c.kick, c.youtube].filter(Boolean).length > 1 || (c.demo && (c.kick || c.youtube));
const PF = { twitch: ['tw', 'Twitch'], kick: ['kk', 'Kick'], youtube: ['yt', 'YouTube'] };
function badgeEls(m) {
  const out = [];
  if (c.icons && multi) { const [cls, title] = PF[m.platform || 'twitch']; const b = SB.el('span', 'pf ' + cls); b.title = title; out.push(b); }
  const add = (cls, letter, title) => { const b = SB.el('span', 'badge ' + cls, letter); b.title = title; out.push(b); };
  if (m.isBroadcaster) add('b', '▶', 'Streamer');
  else if (m.isMod) add('m', '⚔', 'Modérateur');
  if (m.isVip) add('v', '◆', 'VIP');
  if (m.isSub) add('s', '★', 'Abonné');
  return out;
}

function addMessage(m) {
  if (c.hidebots && BOTS.has(m.login)) return;
  if (extraBots.has(m.login)) return;
  if (c.hidecmd && m.text.startsWith('!')) return;

  const row = SB.el('div', 'msg' + (c.anim ? ' anim' : '') + (m.action ? ' action' : ''));
  row.dataset.id = m.id || '';
  row.dataset.login = m.login;
  row.dataset.uid = m.userId || '';
  row.dataset.pf = m.platform || 'twitch';
  if (m.kind === 'superchat' || m.kind === 'sticker') { row.classList.add('paid'); if (m.amount) row.dataset.amount = m.amount; }
  const meta = SB.el('span', 'meta');
  badgeEls(m).forEach((b) => { if (c.badges || b.classList.contains('pf')) meta.appendChild(b); });
  const name = SB.el('span', 'name', m.name);
  name.style.color = SB.nameColor(m);
  meta.appendChild(name);
  if (c.theme !== 'bulles') meta.appendChild(SB.el('span', 'sep', m.action ? '' : ':'));
  const text = SB.el('span', 'text');
  if (m.action) text.style.color = SB.nameColor(m);
  if (m.amount) text.appendChild(SB.el('b', 'paid-amount', m.amount + ' '));
  SB.messageNodes(m, emotes).forEach((n) => text.appendChild(n));
  row.append(meta, ' ', text);
  box.appendChild(row);

  while (box.children.length > c.max) box.firstElementChild.remove();
  if (c.fade > 0) setTimeout(() => { row.classList.add('out'); setTimeout(() => row.remove(), 600); }, c.fade * 1000);
}

const chat = new SB.TwitchChat(c.channel);
chat.on('room', (id) => emotes.load(id, c))
    .on('message', addMessage)
    .on('clearchat', (e) => box.querySelectorAll(e.login ? `.msg[data-login="${CSS.escape(e.login)}"]` : '.msg').forEach((n) => n.remove()))
    .on('clearmsg', (id) => box.querySelectorAll(`.msg[data-id="${CSS.escape(id)}"]`).forEach((n) => n.remove()))
    .connect();

/* Kick et YouTube : mêmes messages, même affichage (suppressions et bannissements compris) */
const removeId = (id) => box.querySelectorAll(`.msg[data-id="${CSS.escape(id)}"]`).forEach((n) => n.remove());
const removeUser = (uid) => box.querySelectorAll(`.msg[data-uid="${CSS.escape(uid)}"]`).forEach((n) => n.remove());
const others = [];
if (c.kick || c.kickroom) others.push(new SB.KickChat(c.kick, c.kickroom));
if (c.youtube) others.push(new SB.YouTubeChat(c.youtube));
others.forEach((o) => o.on('message', addMessage).on('delete', removeId).on('clearuser', removeUser)
  .on('clear', (pf) => box.querySelectorAll(`.msg[data-pf="${pf}"]`).forEach((n) => n.remove()))
  .on('status', (s) => { if (s !== 'connected') console.info('StreamBox :', s); }).connect());

if (c.demo) {
  emotes.load(null, c);
  const PFS = ['twitch', c.kick && 'kick', c.youtube && 'youtube'].filter(Boolean);
  const tick = () => {
    const m = SB.fake({}), pf = PFS[Math.floor(Math.random() * PFS.length)];
    if (pf !== 'twitch') { m.platform = pf; m.parts = [{ text: m.text }]; m.emotes = []; m.color = pf === 'kick' ? '#53fc18' : null; }
    chat.inject(m); setTimeout(tick, 900 + Math.random() * 1600);
  };
  tick();
}
SB.hintIfNoChannel(c);
</script>
</body>
</html>
