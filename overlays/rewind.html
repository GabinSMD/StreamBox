<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>StreamBox · Rewind</title>
<link rel="stylesheet" href="../css/overlay.css">
<script src="../js/i18n.js"></script>
</head>
<body>
<div id="rw-stage"></div>
<div id="rw-debug" hidden></div>
<script src="../js/config.js"></script>
<script src="../js/sb.js"></script>
<script src="../js/obs.js"></script>
<script src="../js/highlights.js"></script>
<script>
const c = SB.params({
  channel: '', token: '', title: 'Rewind',
  // Détection des temps forts
  save: 'obs', obsurl: 'ws://127.0.0.1:4455', obspass: '', mic: '', media: 'StreamBox Rewind',
  after: 8, threshold: 0.55, cooldown: 90, wchat: 0.6, wvoice: 0.4,
  // Condensé
  moments: 8, clips: 5, maxclip: 45, minviews: 0, muted: false,
  intro: true, stats: false, chatters: false,
  outro: 'Merci d’avoir été là ! Le stream commence…', auto: 'visible', loop: true, cmd: '!rewind',
  bg: 'scene', size: 40, font: 'Inter', accent: '#9b5cff', debug: false, demo: false,
});
SB.loadFont(c.font); SB.setAccent(c.accent);
document.documentElement.style.setProperty('--size', c.size + 'px');
if (c.bg === 'scene') {
  document.body.classList.add('rw-scene');
  [['5%', '10%', c.accent, '140px', '60px'], ['55%', '45%', '#ff5ca8', '-120px', '-80px'], ['65%', '0%', '#3cc8ff', '-60px', '110px']].forEach(([l, t, col, dx, dy], i) => {
    const b = SB.el('div', 'blob');
    Object.assign(b.style, { left: l, top: t, width: '45vw', height: '45vw', background: col, animationDelay: -i * 5 + 's' });
    b.style.setProperty('--dx', dx); b.style.setProperty('--dy', dy);
    document.body.prepend(b);
  });
}
const stage = document.getElementById('rw-stage');
const GAP = 2 * 3600000; // 2 h sans activité = nouveau stream
const BOTS = new Set(['nightbot', 'streamelements', 'streamlabs', 'moobot', 'fossabot', 'wizebot', 'soundalerts', 'sery_bot']);
const twitchReady = () => !!(SB.ovLink || (c.token && window.SB_CONFIG && SB_CONFIG.twitchClientId)); // lien du compte : le relais lit Twitch et crée le clip
let playing = false;

/* =================== 1. MÉMOIRE DES STREAMS ===================
 * Tout reste dans le stockage local d'OBS (la source doit rester dans OBS, même cachée). */
const KEY = 'sb-rewind-' + (c.channel.toLowerCase() || 'local');
let DB;
try { DB = JSON.parse(localStorage.getItem(KEY)) || { sessions: [] }; } catch (e) { DB = { sessions: [] }; }
let live = null; // { start } d'après l'API Twitch, si connecté
let dirty = false;

function currentSession(t) {
  let s = DB.sessions[DB.sessions.length - 1];
  const liveStart = live && live.start;
  const isNew = !s || (liveStart ? s.start < liveStart - 600000 : t - s.last > GAP);
  if (isNew) {
    s = { start: liveStart || t, last: t, msgs: 0, chatters: {}, emotes: {}, subs: 0, gifts: 0, bits: 0, raids: [], highlights: [] };
    DB.sessions.push(s);
    DB.sessions = DB.sessions.slice(-5);
  }
  s.highlights = s.highlights || [];
  s.last = t;
  return s;
}
function record(fn) {
  if (c.demo || playing) return;
  if (twitchReady() && !live) return; // l'API dit qu'on est hors live
  fn(currentSession(Date.now()));
  dirty = true;
}
function save() {
  if (!dirty) return; dirty = false;
  DB.sessions.forEach((s) => {
    s.chatters = Object.fromEntries(Object.entries(s.chatters).sort((a, b) => b[1].n - a[1].n).slice(0, 100));
    s.emotes = Object.fromEntries(Object.entries(s.emotes).sort((a, b) => b[1].n - a[1].n).slice(0, 30));
    if (s.highlights.length > 40) s.highlights = s.highlights.sort((a, b) => b.score - a.score).slice(0, 40).sort((a, b) => a.t - b.t);
  });
  try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { /* stockage plein ou indisponible */ }
}
setInterval(save, 20000);
addEventListener('beforeunload', save);

/* =================== 2. DÉTECTION DES TEMPS FORTS =================== */
const det = new SB.HighlightDetector({ threshold: c.threshold, cooldown: c.cooldown, wchat: c.wchat, wvoice: c.wvoice });
const status = { chat: c.demo ? 'démo' : c.channel ? 'connexion…' : 'aucune chaîne', obs: c.demo ? 'démo' : c.save === 'obs' ? 'connexion…' : 'non utilisé', replay: '', mic: '' };

det.on('trigger', () => {
  // On laisse la réaction se dérouler, puis on enregistre les dernières secondes
  setTimeout(async () => {
    const h = det.finish();
    if (!h || c.demo) { if (h) demoMoments.push(Object.assign(h, { kind: 'demo' })); return; }
    try {
      if (c.save === 'obs' && obs && obs.ready) {
        const saved = obs.once('ReplayBufferSaved', 15000);
        await obs.call('SaveReplayBuffer');
        const ev = await saved;
        const path = (ev && ev.savedReplayPath) || (await obs.call('GetLastReplayBufferReplay')).savedReplayPath;
        Object.assign(h, { kind: 'obs', path });
      } else if (c.save === 'twitch' && twitchReady()) {
        const d = await SB.helix('clips?broadcaster_id=' + (await getUserId()), c.token, { method: 'POST' }).catch((e) => { throw new Error('création du clip refusée (' + e.message + ')'); });
        Object.assign(h, { kind: 'twitch', clipId: d.data[0].id });
      } else h.kind = 'moment';
    } catch (e) { h.kind = 'moment'; h.error = e.message; console.warn(e); }
    record((s) => s.highlights.push(h));
    save(); renderDebug();
  }, c.after * 1000);
});

/* ---- Chat ---- */
const emotes = new SB.EmoteStore();
const chat = new SB.TwitchChat(c.channel);
chat.on('status', (s) => { status.chat = s === 'connected' ? 'connecté' : 'déconnecté'; })
  .on('room', (id) => emotes.load(id))
  .on('message', (m) => {
    const cmd = SB.command(m, c.cmd);
    if (m.isMod && cmd !== null) { onCommand(cmd); return; }
    if (BOTS.has(m.login) || playing) return;
    det.addMessage(m);
    record((s) => {
      s.msgs++;
      const ch = s.chatters[m.login] || (s.chatters[m.login] = { n: 0, name: m.name });
      ch.n++;
      SB.extractEmotes(m, emotes).forEach((e) => { const x = s.emotes[e.name] || (s.emotes[e.name] = { n: 0, url: e.url }); x.n++; });
      if (m.bits) s.bits += m.bits;
    });
  })
  .on('usernotice', (n) => record((s) => {
    if (n.type === 'sub' || n.type === 'resub') s.subs++;
    else if ((n.type === 'subgift' || n.type === 'anonsubgift') && !n.isCommunityGift) { s.subs++; s.gifts++; }
    else if (n.type === 'submysterygift' || n.type === 'anonsubmysterygift') { s.subs += n.giftCount; s.gifts += n.giftCount; }
    else if (n.type === 'raid') s.raids.push({ name: n.name, viewers: n.viewers });
  }))
  .connect();

/* ---- OBS : niveau du micro + Replay Buffer + lecture ---- */
let obs = null, micName = null;
if (c.save === 'obs' && !c.demo) {
  obs = new SB.OBS(c.obsurl, c.obspass);
  obs.on('status', (s) => { status.obs = s; renderDebug(); })
    .on('ready', async () => {
      try {
        const inputs = (await obs.call('GetInputList')).inputs || [];
        const mic = c.mic ? inputs.find((i) => i.inputName.toLowerCase() === c.mic.toLowerCase())
          : inputs.find((i) => /input_capture/.test(i.inputKind) && !/output/.test(i.inputKind));
        micName = mic ? mic.inputName : null;
        status.mic = micName || (c.mic ? `« ${c.mic} » introuvable` : 'aucun micro trouvé');
        const rb = await obs.call('GetReplayBufferStatus');
        if (!rb.outputActive) await obs.call('StartReplayBuffer');
        status.replay = 'actif';
      } catch (e) { status.replay = 'indisponible : active-le dans Paramètres → Sortie → Replay Buffer'; }
      renderDebug();
    })
    .on('InputVolumeMeters', (d) => {
      if (!micName || playing) return;
      const inp = (d.inputs || []).find((i) => i.inputName === micName);
      if (!inp || !inp.inputLevelsMul) return;
      det.addLevel(Math.max(0, ...inp.inputLevelsMul.map((ch) => ch[1] || 0)));
    })
    .connect();
}
function onCommand(a) {
  if (/^stop$/i.test(a)) stop();
  else if (/^(clip|marquer)$/i.test(a)) { if (!playing) det.force(); }
  else play();
}
const onRemote = (m) => onCommand(SB.command(m, c.cmd) || '');
SB.remote('rewind', c.cmd, onRemote, obs || undefined);

/* =================== 3. API TWITCH =================== */
let userId = null;
async function getUserId() {
  if (!userId) userId = ((await SB.helix('users?login=' + encodeURIComponent(c.channel), c.token)).data[0] || {}).id;
  if (!userId) throw new Error('chaîne introuvable');
  return userId;
}
async function refreshLive() {
  if (!twitchReady() || !c.channel) return;
  try {
    const st = (await SB.helix('streams?user_id=' + (await getUserId()), c.token)).data[0];
    live = st ? { start: Date.parse(st.started_at) } : null;
  } catch (e) { console.warn(e); }
}
refreshLive(); setInterval(refreshLive, 120000);

/* Clips de la communauté sur le stream précédent : complément si peu de temps forts détectés */
async function communityClips(local) {
  if (!twitchReady() || !c.clips) return [];
  try {
    const id = await getUserId();
    const to = local ? local.last : live ? live.start : Date.now();
    const from = local ? local.start : to - 7 * 86400000;
    const iso = (t) => new Date(t).toISOString();
    const clips = (await SB.helix(`clips?broadcaster_id=${id}&started_at=${iso(from - 600000)}&ended_at=${iso(to + 3600000)}&first=50`, c.token)).data || [];
    return clips.filter((x) => x.view_count >= c.minviews).sort((a, b) => b.view_count - a.view_count).slice(0, c.clips)
      .map((x) => ({ kind: 'twitch', clipId: x.id, t: Date.parse(x.created_at), title: x.title, by: x.creator_name, views: x.view_count, dur: x.duration, community: true }));
  } catch (e) { console.warn(e); return []; }
}

/* =================== 4. LE CONDENSÉ =================== */
const nf = (n) => Number(n).toLocaleString(SB_LANG_TAG);
const fmtDur = (ms) => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`; };
const fmtOffset = (ms) => { const m = Math.max(0, Math.floor(ms / 60000)); return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function slide(cls) { return SB.el('div', 'rw-slide ' + (cls || '')); }
function heading(s, kicker, title) { s.appendChild(SB.el('div', 'rw-kicker', kicker)); if (title) s.appendChild(SB.el('h1', 'rw-h1', title)); }

function caption(h, rank, total, start) {
  const cap = SB.el('div', 'rw-cap');
  cap.appendChild(SB.el('span', 'rw-rank', `${rank}/${total}`));
  const main = SB.el('div', 'rw-cmain');
  const line = SB.el('div', 'rw-ctitle');
  if (h.community) line.textContent = h.title;
  else {
    const parts = [];
    if (h.reasons && h.reasons.includes('chat')) parts.push('🔥 Le chat s’enflamme');
    if (h.reasons && h.reasons.includes('voix')) parts.push('🎙️ Grosse réaction');
    if (h.reasons && h.reasons.includes('manuel')) parts.push('📸 Choisi par le streamer');
    line.textContent = parts.join(' · ') || '⭐ Temps fort';
  }
  main.appendChild(line);
  const meta = [];
  if (start && h.t) meta.push('à ' + fmtOffset(h.t - start));
  if (h.community) meta.push(`clippé par ${h.by} · ${nf(h.views)} vues`);
  if (h.top && h.top.length) meta.push('Le chat : ' + h.top.map(([w, n]) => `${w} ×${n}`).join('  '));
  if (h.quote && h.quote.length > 3) meta.push('« ' + h.quote + ' »');
  main.appendChild(SB.el('div', 'rw-cmeta', meta.join(' · ')));
  cap.appendChild(main);
  if (h.score && !h.community) {
    const sc = SB.el('div', 'rw-score');
    sc.append(SB.el('b', null, Math.round(h.score * 100)), SB.el('span', null, 'intensité'));
    cap.appendChild(sc);
  }
  return cap;
}

function hole(on) { document.body.classList.toggle('rw-hole', on); }

async function playObsMedia(path, id) {
  if (!obs || !obs.ready) throw new Error('OBS non connecté');
  await obs.call('SetInputSettings', { inputName: c.media, inputSettings: { is_local_file: true, local_file: path, looping: false, restart_on_activate: false, clear_on_media_end: true, close_when_inactive: false } });
  const ended = obs.once('MediaInputPlaybackEnded', c.maxclip * 1000 + 5000, (d) => d.inputName === c.media);
  await obs.call('TriggerMediaInputAction', { inputName: c.media, mediaAction: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART' });
  await Promise.race([ended, wait(c.maxclip * 1000), (async () => { while (id === runId) await wait(300); })()]);
  stopMedia();
}
function stopMedia() { if (obs && obs.ready) obs.call('TriggerMediaInputAction', { inputName: c.media, mediaAction: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_STOP' }).catch(() => {}); }

function buildSlides(local, moments) {
  const S = [];
  const start = local && local.start;
  if (c.intro) S.push({ dur: 5500, make: () => {
    const s = slide('rw-intro');
    s.appendChild(SB.el('div', 'rw-logo', '⏪ ' + c.title));
    s.appendChild(SB.el('div', 'rw-kicker', 'Le stream précédent'));
    s.appendChild(SB.el('h1', 'rw-h1', moments.length ? `${moments.length} temps forts` : 'Ce qu’on a vécu ensemble'));
    const meta = [];
    if (start) meta.push(new Date(start).toLocaleDateString(SB_LANG_TAG, { weekday: 'long', day: 'numeric', month: 'long' }));
    if (local) meta.push(fmtDur(local.last - local.start) + ' de live');
    if (moments.some((m) => !m.community)) meta.push('repérés grâce aux réactions du chat et à la voix');
    s.appendChild(SB.el('div', 'rw-meta rw-date', meta.join(' · ')));
    return s;
  } });

  if (local && c.stats) S.push({ dur: 7000, make: () => {
    const s = slide(); heading(s, 'En chiffres', 'Ce qu’on a vécu ensemble');
    const grid = SB.el('div', 'rw-tiles');
    const tile = (n, l) => { const t = SB.el('div', 'rw-tile'); t.append(SB.el('b', null, nf(n)), SB.el('span', null, l)); grid.appendChild(t); };
    tile(local.msgs, 'messages'); tile(Object.keys(local.chatters).length, 'personnes dans le chat');
    if (local.subs) tile(local.subs, local.gifts ? `abos (dont ${local.gifts} offerts)` : 'abos');
    if (local.bits) tile(local.bits, 'bits');
    s.appendChild(grid);
    return s;
  } });

  const chatters = local ? Object.entries(local.chatters).sort((a, b) => b[1].n - a[1].n).slice(0, 3) : [];
  if (c.chatters && chatters.length >= 3) S.push({ dur: 6500, make: () => {
    const s = slide(); heading(s, 'Merci à vous', 'Les plus bavards du chat');
    const pod = SB.el('div', 'rw-podium');
    [1, 0, 2].forEach((i) => {
      const p = SB.el('div', 'rw-step rw-step' + (i + 1));
      p.append(SB.el('div', 'rw-medal', ['🥇', '🥈', '🥉'][i]), SB.el('div', 'rw-name', chatters[i][1].name), SB.el('div', 'rw-count', nf(chatters[i][1].n) + ' messages'));
      pod.appendChild(p);
    });
    s.appendChild(pod);
    return s;
  } });

  moments.forEach((h, i) => {
    S.push({
      make: () => {
        const s = slide('rw-clip' + (h.kind === 'obs' ? ' rw-onobs' : ''));
        if (h.kind !== 'obs') {
          const frame = SB.el('div', 'rw-frame');
          if (h.kind === 'twitch' && location.hostname && !c.demo) {
            const f = document.createElement('iframe');
            f.allow = 'autoplay; fullscreen';
            f.src = `https://clips.twitch.tv/embed?clip=${encodeURIComponent(h.clipId)}&parent=${location.hostname}&autoplay=true&muted=${c.muted}`;
            frame.appendChild(f);
          } else {
            frame.classList.add('rw-fake');
            frame.append(SB.el('div', null, '▶ Temps fort n°' + (i + 1)), SB.el('small', null, c.demo ? 'Aperçu : la vidéo du temps fort sera lue ici' : 'Pas de vidéo enregistrée pour ce moment'));
          }
          s.appendChild(frame);
        } else s.appendChild(SB.el('div', 'rw-spacer'));
        s.appendChild(caption(h, i + 1, moments.length, start));
        return s;
      },
      run: async (id) => {
        if (h.kind === 'obs') {
          hole(true);
          try { await playObsMedia(h.path, id); } catch (e) { console.warn(e); await wait(4000); }
          hole(false);
        } else if (h.kind === 'twitch' && !c.demo) await wait((Math.min(h.dur || 30, c.maxclip) + 2) * 1000);
        else await wait(c.demo ? 5000 : 4000);
      },
    });
  });

  S.push({ dur: c.loop ? 6000 : 0, make: () => {
    const s = slide('rw-intro');
    s.appendChild(SB.el('div', 'rw-logo', '⏪ ' + c.title));
    s.appendChild(SB.el('h1', 'rw-h1', c.outro));
    return s;
  } });
  return S;
}

let runId = 0;
function show(el) {
  const old = stage.firstElementChild;
  if (old) { old.classList.add('rw-out'); setTimeout(() => old.remove(), 600); }
  stage.appendChild(el);
}
function stop() { runId++; playing = false; det.paused = false; hole(false); stopMedia(); stage.replaceChildren(); }

function pickPrevious() {
  const now = Date.now();
  const list = DB.sessions.filter((s) => s.msgs > 0 || (s.highlights && s.highlights.length));
  const cur = list.find((s) => (live ? s.start >= live.start - 600000 : now - s.last < 30 * 60000));
  const done = list.filter((s) => s !== cur);
  return done[done.length - 1] || null;
}

async function play() {
  const id = ++runId;
  playing = true; det.paused = true; save();
  const local = c.demo ? demoSession() : pickPrevious();
  let moments = local && local.highlights ? local.highlights.filter((h) => h.kind !== 'moment' || !twitchReady()) : [];
  moments = moments.sort((a, b) => b.score - a.score).slice(0, c.moments);
  if (moments.length < c.moments && !c.demo) {
    const extra = await communityClips(local);
    const have = new Set(moments.map((m) => m.clipId).filter(Boolean));
    moments = moments.concat(extra.filter((x) => !have.has(x.clipId)).slice(0, c.moments - moments.length));
  }
  moments.sort((a, b) => a.t - b.t); // le condensé suit l'ordre du stream
  if (id !== runId) return;
  if (!local && !moments.length) {
    const s = slide('rw-intro');
    s.appendChild(SB.el('div', 'rw-logo', '⏪ ' + c.title));
    s.appendChild(SB.el('h1', 'rw-h1', 'Pas encore de récap'));
    s.appendChild(SB.el('div', 'rw-meta', 'Le Rewind analyse ce stream : le condensé sera prêt au prochain.'));
    show(s); playing = false; det.paused = false; return;
  }
  const slides = buildSlides(local, moments);
  for (;;) {
    for (const sl of slides) {
      if (id !== runId) return;
      show(sl.make());
      if (sl.run) await sl.run(id);
      else if (!sl.dur) { playing = false; det.paused = false; return; }
      else await wait(sl.dur);
    }
    if (!c.loop) break;
  }
  playing = false; det.paused = false;
}

/* Démarrage : à l'affichage de la scène dans OBS (relance depuis le début), au chargement, ou par !rewind */
if (c.auto !== 'commande') play();
if (c.auto === 'visible') addEventListener('obsSourceVisibleChanged', (e) => { if (e.detail && e.detail.visible) play(); else stop(); });

/* =================== 5. PANNEAU D'ANALYSE (réglages) =================== */
const dbg = document.getElementById('rw-debug');
function bar(label, v, mark) {
  const row = SB.el('div', 'rw-dbar');
  const track = SB.el('div', 'rw-dtrack'); const fill = SB.el('div', 'rw-dfill'); fill.style.width = Math.round(v * 100) + '%';
  track.appendChild(fill);
  if (mark != null) { const m = SB.el('div', 'rw-dmark'); m.style.left = mark * 100 + '%'; track.appendChild(m); }
  row.append(SB.el('span', null, label), track, SB.el('b', null, Math.round(v * 100)));
  return row;
}
function renderDebug() {
  if (!c.debug) return;
  dbg.hidden = false;
  const s = det.lastScores;
  const sess = c.demo ? { highlights: demoMoments } : DB.sessions[DB.sessions.length - 1];
  const list = SB.el('div', 'rw-dlist');
  ((sess && sess.highlights) || []).slice(-4).reverse().forEach((h) => {
    list.appendChild(SB.el('div', null, `${new Date(h.t).toLocaleTimeString(SB_LANG_TAG)} · intensité ${Math.round(h.score * 100)} · ${h.kind === 'obs' ? 'vidéo OBS ✓' : h.kind === 'twitch' ? 'clip Twitch ✓' : h.kind === 'demo' ? 'démo' : 'non enregistré' + (h.error ? ' (' + h.error + ')' : '')}`));
  });
  dbg.replaceChildren(
    SB.el('div', 'rw-dtitle', 'Analyse des temps forts' + (det.paused ? ' (en pause pendant le récap)' : '')),
    bar('Chat', s.chat), bar('Voix', s.voice), bar('Total', s.total, c.threshold),
    SB.el('div', 'rw-dinfo', `Chat : ${status.chat} · ${s.rate} msg/10 s (habituel ${s.base.toFixed(1)})`),
    SB.el('div', 'rw-dinfo', c.save === 'obs' ? `OBS : ${status.obs} · micro : ${status.mic || '…'} · Replay Buffer : ${status.replay || '…'}` : `Enregistrement : ${c.save === 'twitch' ? 'clips Twitch' : 'aucun'}`),
    list,
  );
}
if (c.debug) det.on('scores', renderDebug);

/* =================== Démo =================== */
const demoMoments = [];
function demoSession() {
  const start = Date.now() - 26 * 3600000;
  const chatters = {};
  SB.demoUsers.forEach((u, i) => (chatters[u.login.toLowerCase()] = { n: [412, 260, 233, 198, 120, 88, 75][i], name: u.login }));
  const H = (min, score, reasons, top, quote) => ({ t: start + min * 60000, score, chat: score, voice: reasons.includes('voix') ? score : 0.1, reasons, top, quote, kind: 'demo' });
  return { start, last: start + 4.3 * 3600000, msgs: 4821, chatters, subs: 37, gifts: 20, bits: 6400, raids: [], emotes: {},
    highlights: [
      H(42, 0.71, ['chat'], [['KEKW', 48], ['mdr', 21]], 'il est tombé tout seul'),
      H(95, 0.93, ['chat', 'voix'], [['POG', 62], ['CLIP', 18]], 'clip clip clip'),

      H(233, 0.58, ['chat'], [['GG', 55]], 'gg la team'),
    ].slice(0, c.moments) };
}
if (c.demo && c.debug) { // fait vivre le panneau d'analyse avec un faux chat et une fausse voix
  let t = 0;
  setInterval(() => {
    t++;
    const burst = t % 40 > 30;

}
