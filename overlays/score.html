<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>StreamBox · Tableau de score</title>
<link rel="stylesheet" href="../css/overlay.css">
<script src="../js/i18n.js"></script>
</head>
<body>
<div class="sc" id="board">
  <div class="sc-head"><span class="sc-title" id="title"></span><span class="sc-round" id="round"></span></div>
  <div class="sc-teams" id="teams"></div>
</div>
<script src="../js/config.js"></script>
<script src="../js/sb.js"></script>
<script>
/* Tableau de score pour les tournois et les défis : 2 à 4 équipes, scores et manche en cours.
 *   !score 1 +   !score 2 +3   !score 1 -   !score 2 = 5   !score reset   !manche +   !manche = 3
 * Pilotable aussi depuis le panneau de contrôle. Les scores sont gardés dans OBS (rechargement sans perte). */
const c = SB.params({
  channel: '', teams: 'Équipe bleue | #3b82f6\nÉquipe rouge | #ef4444', title: '', bo: 0, rounds: true, level: 'mod', cmd: '!score', roundcmd: '!manche',
  size: 30, font: 'Inter', accent: '#9b5cff', demo: false,
});
SB.loadFont(c.font); SB.setAccent(c.accent);
document.documentElement.style.setProperty('--size', c.size + 'px');
const $ = (id) => document.getElementById(id);
const LEVEL = { everyone: 0, sub: 1, vip: 2, mod: 3 };
const level = (m) => (m.isBroadcaster ? 4 : m.isMod ? 3 : m.isVip ? 2 : m.isSub ? 1 : 0);
const teams = c.teams.split('\n').map((l) => l.split('|').map((x) => x.trim())).filter(([n]) => n).slice(0, 4)
  .map(([name, color]) => ({ name, color: /^#[0-9a-f]{6}$/i.test(color || '') ? color : null }));
while (teams.length < 2) teams.push({ name: SB.t('Équipe {0}', [teams.length + 1]), color: null });
const key = 'sb-score:' + (new URLSearchParams(location.search).get('o') || c.channel || 'local');
let S = { scores: teams.map(() => 0), round: 1 };
try { const x = JSON.parse(localStorage.getItem(key) || 'null'); if (x && Array.isArray(x.scores)) S = { scores: teams.map((_, i) => +x.scores[i] || 0), round: +x.round || 1 }; } catch (e) { /* ignore */ }
const save = () => { try { localStorage.setItem(key, JSON.stringify(S)); } catch (e) { /* ignore */ } };

const cells = teams.map((t, i) => {
  const row = SB.el('div', 'sc-team'); if (t.color) row.style.setProperty('--team', t.color);
  const v = SB.el('b', 'sc-v');
  row.append(SB.el('span', 'sc-name', t.name), v);
  $('teams').appendChild(row);
  return { row, v };
});
if (teams.length > 2) $('board').classList.add('sc-many');
function draw(bump) {
  cells.forEach((x, i) => { x.v.textContent = String(S.scores[i]); });
  const lead = Math.max(...S.scores);
  cells.forEach((x, i) => x.row.classList.toggle('lead', lead > 0 && S.scores[i] === lead && S.scores.filter((s) => s === lead).length === 1));
  const win = c.bo > 0 ? Math.floor(c.bo / 2) + 1 : 0, winner = win ? S.scores.findIndex((s) => s >= win) : -1;
  $('title').textContent = winner >= 0 ? SB.t('{0} gagne !', [teams[winner].name]) : c.title;
  $('round').textContent = c.rounds ? (c.bo > 0 ? SB.t('Manche {0} · BO{1}', [S.round, c.bo]) : SB.t('Manche {0}', [S.round])) : '';
  $('board').classList.toggle('sc-win', winner >= 0);
  $('board').querySelector('.sc-head').hidden = !$('title').textContent && !$('round').textContent;
  if (bump != null && cells[bump]) { const r = cells[bump].row; r.classList.remove('bump'); void r.offsetWidth; r.classList.add('bump'); }
}
const clamp = (n) => Math.max(-9999, Math.min(9999, Math.round(n)));
function onMessage(m) {
  if (level(m) < LEVEL[c.level]) return;
  let a = SB.command(m, c.cmd), r;
  if (a !== null) {
    a = a.trim().toLowerCase();
    if (/^(reset|zero|zéro|0)$/.test(a)) { S.scores = S.scores.map(() => 0); S.round = 1; save(); draw(); return; }
    if (!(r = a.match(/^([1-4])\s*(\+\+?|--?|[+-]\s*\d{1,4}|=?\s*\d{1,4})?$/))) return;
    const i = +r[1] - 1; if (i >= teams.length) return;
    const op = (r[2] || '+').replace(/\s+/g, ''), cur = S.scores[i];
    S.scores[i] = clamp(op === '+' || op === '++' ? cur + 1 : op === '-' || op === '--' ? cur - 1 : /^[+-]\d/.test(op) ? cur + +op : +op.replace('=', ''));
    save(); draw(i); return;
  }
  a = SB.command(m, c.roundcmd);
  if (a === null) return;
  a = a.trim();
  if (a === '+' || a === '') S.round++; else if (a === '-') S.round = Math.max(1, S.round - 1); else if ((r = a.match(/^=?\s*(\d{1,3})$/))) S.round = Math.max(1, +r[1]); else return;
  save(); draw();
}
const chat = new SB.TwitchChat(c.channel);
chat.on('message', onMessage).connect();
SB.remote('score', '', (m) => { // le panneau envoie « score 1 + » ou « manche + »
  const t = m.text.trim(); onMessage(Object.assign(m, { text: t.startsWith('!') ? t : '!' + t }));
});
draw();
if (c.demo) {
  S = { scores: teams.map(() => 0), round: 1 }; draw();
  const steps = [`${c.cmd} 1 +`, `${c.cmd} 2 +`, `${c.roundcmd} +`, `${c.cmd} 1 +`, `${c.roundcmd} +`, `${c.cmd} 2 +`, `${c.roundcmd} +`, `${c.cmd} 1 +`, `${c.cmd} reset`];
  let k = 0; setInterval(() => chat.inject(SB.fake({ user: SB.demoBroadcaster, text: steps[k++ % steps.length] })), 1800);
}
SB.hintIfNoChannel(c);
</script>
</body>
</html>
