name = "streambox-relay"
main = "worker.js"
compatibility_date = "2025-06-01"

# Workers AI : voix française de l'overlay « Lecture à voix haute » (offre gratuite avec quota quotidien)
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Account"]
